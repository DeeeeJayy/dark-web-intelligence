[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cyart-m2-crawler"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "scrapy>=2.11",
    "celery>=5.3",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "trafilatura>=1.8",
    "simhash>=2.1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "chardet>=5.2",
    "dateparser>=1.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "factory-boy>=3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -v"
