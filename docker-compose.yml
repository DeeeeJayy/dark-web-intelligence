version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cyart
      POSTGRES_PASSWORD: cyart
      POSTGRES_DB: darkweb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyart -d darkweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.mock
    ports:
      - "8001:8001"
    depends_on:
      - postgres

volumes:
  pgdata:
